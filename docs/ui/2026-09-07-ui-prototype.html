function render(){const s=specMap[current];sidebar();document.querySelector('#context-view').textContent=s.title;document.querySelector('#page-select').value=current;document.querySelector('#state-select').value=status;let markup;if(status==='loading'){markup=head(s,false)+`<section class="panel empty"><span class="spinner"></span><h2>正在读取${s.title}</h2><p>内容准备好后会在此处显示。此为状态设计演示。</p></section>`}else if(status==='empty'){markup=head(s,false)+`<section class="panel empty">${icon('book')}<h2>${current==='search'?'没有找到相关内容':'这里还没有'+(current==='projects'?'作品':'内容')}</h2><p>${['state','canon','statistics'].includes(current)?'完成相应创作步骤后，这里会显示已有数据。':'先完成当前页需要的输入或选择，再继续下一步。'}</p>${go('返回创作流程','workflow','primary')}</section>`}else if(status==='error'){markup=head(s,false)+`<div class="notice error"><strong>${s.title}暂时无法更新</strong><p>已有内容和未提交的修改保留。请重试本次操作。</p><div class="actions" style="margin-top:12px">${btn('重试当前操作','','retry')}${btn('查看错误详情','ghost','help')}</div></div>`}else{markup=(renderers[s.template]||design)();if(status==='readonly')markup=`<div class="notice" id="readonly-notice">当前作品只读或前置条件尚未满足。可查看内容，写入操作已禁用。</div>`+markup}document.querySelector('#content').innerHTML=markup+`<footer class="prototype-foot">设计面：${esc(s.title)} · 演示数据 · UI 设计提案，未接入真实作品或 AI 服务。<br>所有现有按钮逐条规格见同目录的 <a href="2026-09-07-ui-button-inventory.md">按钮清单</a>；生产实施边界见 <a href="2026-09-07-ui-optimization-plan.md">优化计划</a>。</footer>`;if(status==='readonly'){document.querySelectorAll('#content [data-action],#content input,#content textarea,#content select').forEach(el=>{if(el.matches('button')&&!['help','object','local-tab','demo'].includes(el.dataset.action))el.disabled=true;if(el.matches('input,textarea,select'))el.disabled=true});const prose=document.querySelector('[contenteditable]');if(prose)prose.contentEditable='false'}document.querySelectorAll('#content .btn.primary').forEach(el=>{if(dirty&&el.dataset.action==='save')el.textContent='保存修改'});}

function closeDialog(){document.querySelector('#confirm-dialog').close();if(returnFocus?.isConnected)returnFocus.focus()}
function navigate(id){if(!specMap[id])return;if(dirty&&id!==current){openDialog('放弃未保存修改并离开？',true,()=>{dirty=false;navigate(id)});return}current=id;status='ready';queueState='idle';location.hash=id;render();document.querySelector('#content').focus({preventScroll:true});window.scrollTo(0,0)}
function queueControls(next){queueState=next;document.querySelector('#queue-status').innerHTML=badge(next==='running'?'运行中':next==='paused'?'已暂停':next==='cancelled'?'已取消':'尚未开始',next==='running'?'info':'');document.querySelector('[data-action="queue-start"]').disabled=next==='running'||next==='paused';document.querySelector('[data-action="queue-pause"]').disabled=next!=='running';document.querySelector('[data-action="queue-resume"]').disabled=next!=='paused';document.querySelector('[data-action="queue-cancel"]').disabled=!['running','paused'].includes(next);document.querySelector('#queue-progress').style.width=next==='running'||next==='paused'?'28%':'0';toast('队列状态演示：'+(next==='running'?'运行中':next==='paused'?'已暂停':'已取消'))}
document.querySelector('#page-select').innerHTML=specs.map(s=>`<option value="${s.id}">${s.title}</option>`).join('');
document.querySelector('#page-select').addEventListener('change',e=>navigate(e.target.value));document.querySelector('#state-select').addEventListener('change',e=>{status=e.target.value;dirty=false;render()});document.querySelector('#show-spec').addEventListener('click',()=>navigate('design'));
document.querySelector('#dialog-cancel').addEventListener('click',closeDialog);document.querySelector('#dialog-confirm').addEventListener('click',()=>{closeDialog();const callback=dialogAction;dialogAction=undefined;if(callback)callback();else toast('已完成确认交互演示，没有修改任何作品。')});document.querySelector('#confirm-dialog').addEventListener('cancel',()=>{dialogAction=undefined;setTimeout(()=>returnFocus?.isConnected&&returnFocus.focus(),0)});
document.addEventListener('input',e=>{if(e.target.closest('#content')&&(e.target.matches('input,textarea')||e.target.closest('[contenteditable="true"]'))){dirty=true;const statusEl=document.querySelector('#save-state');if(statusEl)statusEl.textContent='● 有未保存的修改';document.querySelectorAll('[data-dirty-note]').forEach(el=>el.textContent='有未保存的修改。');}});
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target||target.disabled)return;if(target.dataset.page){navigate(target.dataset.page);return}const action=target.dataset.action;if(!action)return;if(action==='nav'){document.querySelector('#sidebar').classList.toggle('mobile-open');return}if(action==='save'){target.disabled=true;const old=target.textContent;target.textContent='正在保存…';setTimeout(()=>{dirty=false;target.disabled=false;target.textContent=old;const s=document.querySelector('#save-state');if(s)s.textContent='✓ 已完成保存演示';document.querySelectorAll('[data-dirty-note]').forEach(el=>el.textContent='已完成保存演示。');toast('保存反馈演示完成；未写入真实作品。')},700);return}if(action==='generate'){target.disabled=true;const old=target.textContent;target.innerHTML='<span class="spinner"></span>正在处理…';setTimeout(()=>{target.disabled=false;target.textContent=old;toast('已演示任务反馈。正式应用显示真实阶段与候选结果。')},1000);return}if(action==='danger'||action==='confirm'||action==='source-confirm'){openDialog(target.textContent,action==='danger');return}if(action==='new'){openDialog('创建空白作品',false,()=>navigate('source'));return}if(action==='retry'){status='ready';render();toast('已恢复正常状态示例。');return}if(action==='keep'||action==='exclude'){document.querySelector('#unresolved-count').textContent='0';document.querySelector('#source-notice').className='notice info';document.querySelector('#review-status').textContent=action==='keep'?'已按当前分类保留，可确认来源。':'已排除此段，可确认剩余来源。';document.querySelector('[data-action="source-confirm"]').disabled=false;for(const b of document.querySelectorAll('[data-action="keep"],[data-action="exclude"]')){b.classList.toggle('choice',b===target);b.classList.toggle('selected',b===target);b.setAttribute('aria-pressed',String(b===target))}toast(action==='keep'?'已保留此段（演示）':'已排除此段（演示）');return}if(action==='choice'){const parent=target.closest('.actions,.spec-row');parent?.querySelectorAll('[data-action="choice"]').forEach(b=>{b.classList.toggle('selected',b===target);b.classList.toggle('choice',b===target);b.setAttribute('aria-pressed',String(b===target))});toast('已切换本地选择示例。');return}if(action==='object'){const parent=target.closest('.object-list,.chapter-tree');parent?.querySelectorAll('[data-action="object"]').forEach(b=>{b.classList.toggle('selected',b===target);b.setAttribute('aria-pressed',String(b===target))});toast('对象选择交互示例；详情仍为固定设计样稿。');return}if(action==='local-tab'){target.parentElement.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b===target);b.setAttribute('aria-pressed',String(b===target))});toast('页内选项样式示例；详细业务布局见设计文档。');return}if(action.startsWith('queue-')){queueControls(action==='queue-pause'?'paused':action==='queue-cancel'?'cancelled':'running');return}if(action==='search'){const text=document.querySelector('#search-input')?.value.trim()||'';document.querySelector('#search-results').innerHTML=text.includes('灯塔')?rows([['北岸灯塔','世界观 / 地点 · 仅在退潮时可从陆路抵达。','设定'],['灯塔里的旧信','正文 / 第七章 · 林舟站在灯塔的台阶下。','正文']]):'<div class="empty"><h3>没有找到相关内容</h3><p>这是本地示例搜索；试试“灯塔”。</p></div>';return}if(action==='help'){openDialog('操作说明',false);document.querySelector('#dialog-description').textContent='说明在当前上下文就地出现，解释分类、影响或失败原因。正式产品保留统一术语并过滤敏感信息。';return}toast(action==='export'?'导出按钮反馈演示；没有创建稿件文件。':'已展示此操作的反馈位置；业务细节见逐按钮清单。');});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(specMap[id]&&id!==current)navigate(id)});
render();
</script>
</body>
</html>
